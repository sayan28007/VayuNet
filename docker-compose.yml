services:
  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  command-center:
    build:
      context: ./apps/command-center
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
